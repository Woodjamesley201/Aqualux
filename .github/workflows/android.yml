name: Android

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore when secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.AQUALUX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AQUALUX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AQUALUX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AQUALUX_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aqualux.keystore"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/aqualux.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "No release keystore secrets; assembleRelease will be signed with the debug key."
          fi

      - name: Assemble debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aqualux-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
